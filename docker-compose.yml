services:
  db:
    # Pinned: pgvector version and Postgres major are part of the schema contract.
    image: pgvector/pgvector:0.8.1-pg17
    container_name: hn-jobs-db
    ports:
      - "127.0.0.1:5433:5432" # loopback only; 5433 avoids clashing with a local Postgres
    environment:
      POSTGRES_DB: hnjobs
      POSTGRES_USER: hnjobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnjobs -d hnjobs"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
